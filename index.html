<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TV Guide</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #0f0f0f; color: #fff; }
.header { padding: 1.5rem; border-bottom: 1px solid #222; }
.header h1 { font-size: 22px; font-weight: 600; margin-bottom: 4px; }
.header p { font-size: 13px; color: #888; }
.stats { display: flex; gap: 12px; padding: 1rem 1.5rem; border-bottom: 1px solid #222; flex-wrap: wrap; }
.stat { background: #1a1a1a; border-radius: 8px; padding: 10px 16px; min-width: 100px; }
.stat-label { font-size: 11px; color: #666; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.5px; }
.stat-value { font-size: 22px; font-weight: 600; }
.controls { padding: 1rem 1.5rem; display: flex; gap: 10px; flex-wrap: wrap; border-bottom: 1px solid #222; align-items: center; }
.tab { padding: 7px 16px; border-radius: 20px; border: 1px solid #333; background: transparent; color: #aaa; font-size: 13px; cursor: pointer; transition: all 0.15s; }
.tab.active { background: #fff; color: #000; border-color: #fff; font-weight: 500; }
input, select { background: #1a1a1a; border: 1px solid #333; border-radius: 8px; padding: 8px 12px; color: #fff; font-size: 13px; outline: none; }
input { flex: 1; min-width: 180px; }
input::placeholder { color: #555; }
.channel-list { padding: 1rem 1.5rem; max-width: 900px; }
.channel-card { background: #1a1a1a; border-radius: 12px; padding: 1rem; margin-bottom: 10px; border: 1px solid #222; }
.channel-header { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
.logo { width: 38px; height: 38px; object-fit: contain; border-radius: 6px; background: #111; flex-shrink: 0; }
.logo-placeholder { width: 38px; height: 38px; border-radius: 6px; background: #2a2a2a; display: flex; align-items: center; justify-content: center; font-size: 10px; color: #555; flex-shrink: 0; }
.channel-name { font-size: 14px; font-weight: 500; }
.channel-meta { font-size: 11px; color: #555; margin-top: 2px; }
.programme { display: flex; gap: 10px; padding: 6px 0; border-top: 1px solid #222; }
.prog-time { font-size: 12px; color: #555; min-width: 75px; flex-shrink: 0; padding-top: 2px; }
.prog-title { font-size: 13px; color: #ddd; font-weight: 500; }
.prog-desc { font-size: 12px; color: #555; margin-top: 3px; line-height: 1.4; }
.badge-now { display: inline-block; background: #16a34a; color: #fff; font-size: 10px; font-weight: 600; padding: 2px 6px; border-radius: 10px; margin-left: 6px; vertical-align: middle; }
.badge-sport { display: inline-block; background: #1d4ed8; color: #fff; font-size: 10px; padding: 2px 6px; border-radius: 10px; margin-left: 4px; vertical-align: middle; }
.progress-wrap { height: 3px; background: #333; border-radius: 2px; margin-top: 6px; }
.progress-bar { height: 100%; background: #3b82f6; border-radius: 2px; }
.load-more-btn { display: block; width: 100%; padding: 12px; background: #1a1a1a; border: 1px solid #333; border-radius: 10px; color: #aaa; font-size: 14px; cursor: pointer; margin-top: 8px; }
.status-msg { text-align: center; padding: 4rem 1rem; color: #555; font-size: 14px; }
.error-msg { background: #1a0a0a; border: 1px solid #5a1a1a; border-radius: 10px; padding: 1.25rem; color: #f87171; font-size: 13px; line-height: 1.7; margin: 1rem 0; }
</style>
</head>
<body>

<div class="header">
  <h1>📺 TV Guide</h1>
  <p id="subtitle">Loading your channels...</p>
</div>

<div class="stats" id="stats" style="display:none">
  <div class="stat"><div class="stat-label">Channels</div><div class="stat-value" id="s-channels">0</div></div>
  <div class="stat"><div class="stat-label">On now</div><div class="stat-value" id="s-now">0</div></div>
  <div class="stat"><div class="stat-label">Sport now</div><div class="stat-value" id="s-sport">0</div></div>
</div>

<div class="controls" id="controls" style="display:none">
  <button class="tab active" onclick="setTab(this,'all')">All</button>
  <button class="tab" onclick="setTab(this,'now')">On now</button>
  <button class="tab" onclick="setTab(this,'sport')">Sport</button>
  <button class="tab" onclick="setTab(this,'english')">English</button>
  <input type="text" id="search" placeholder="Search channels or shows..." oninput="render()" />
  <select id="lang" onchange="render()"><option value="">All languages</option></select>
</div>

<div class="channel-list" id="channel-list">
  <div class="status-msg">Loading EPG data... this takes 20-30 seconds on first load.</div>
</div>

<script>
const EPG = 'https://305.halfvex.com/xmltv.php?username=ib123&password=gP4HRjkXrc';
const SERVER = 'https://epg-app-production.up.railway.app';
const SPORT = ['sport','football','soccer','cricket','nrl','afl','nba','nfl','rugby','tennis','golf','racing','f1','boxing','ufc','mma','league','premier','champions','serie','bundesliga','ligue','grand prix','supercars','basketball','baseball','hockey','cycling','athletics','olympic','netball'];

let channels = [], tab = 'all', shown = 20;

function isSport(ch) {
  const n = (ch.name || '').toLowerCase();
  if (SPORT.some(k => n.includes(k))) return true;
  const titles = [(ch.now||{}).title, ...((ch.next||[]).map(p=>p.title))].filter(Boolean).join(' ').toLowerCase();
  return SPORT.some(k => titles.includes(k));
}

function fmt(raw) {
  if (!raw) return '';
  const s = raw.toString().trim();
  const utc = new Date(Date.UTC(+s.slice(0,4),+s.slice(4,6)-1,+s.slice(6,8),+s.slice(8,10),+s.slice(10,12),0));
  const off = s.slice(12).trim();
  if (off.length >= 3) {
    const sign = off[0]==='-'?-1:1;
    utc.setMinutes(utc.getMinutes() - sign*(+off.slice(1,3)*60+(+off.slice(3,5)||0)));
  }
  return utc.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
}

function setTab(el, t) {
  tab = t; shown = 20;
  document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
  el.classList.add('active');
  render();
}

function filtered() {
  const q = (document.getElementById('search').value || '').toLowerCase();
  const lang = document.getElementById('lang').value;
  return channels.filter(ch => {
    if (tab === 'now' && !ch.now) return false;
    if (tab === 'sport' && !isSport(ch)) return false;
    if (tab === 'english') { const l = (ch.lang||'').toLowerCase(); if (l && l !== 'en' && l !== 'english') return false; }
    if (lang && ch.lang !== lang) return false;
    if (q) {
      const nm = (ch.name||'').toLowerCase().includes(q);
      const np = ((ch.now||{}).title||'').toLowerCase().includes(q);
      const nx = (ch.next||[]).some(p => (p.title||'').toLowerCase().includes(q));
      if (!nm && !np && !nx) return false;
    }
    return true;
  });
}

function render() {
  const list = filtered();
  const el = document.getElementById('channel-list');
  if (!list.length) { el.innerHTML = '<div class="status-msg">No channels match.</div>'; return; }
  const slice = list.slice(0, shown);
  el.innerHTML = slice.map(ch => {
    const sport = isSport(ch);
    const logo = ch.logo
      ? `<img class="logo" src="${ch.logo}" alt="" onerror="this.style.display='none';this.nextSibling.style.display='flex'" /><div class="logo-placeholder" style="display:none">${(ch.name||'').slice(0,3)}</div>`
      : `<div class="logo-placeholder">${(ch.name||'').slice(0,3)}</div>`;
    let ph = '';
    if (ch.now) {
      ph += `<div class="programme">
        <div class="prog-time">${fmt(ch.now.startRaw)}</div>
        <div style="flex:1">
          <div class="prog-title">${ch.now.title}<span class="badge-now">Now</span>${sport?'<span class="badge-sport">Sport</span>':''}</div>
          ${ch.now.desc ? `<div class="prog-desc">${ch.now.desc}</div>` : ''}
          <div class="progress-wrap"><div class="progress-bar" style="width:${ch.now.pct}%"></div></div>
        </div>
      </div>`;
    }
    (ch.next||[]).forEach(p => {
      ph += `<div class="programme">
        <div class="prog-time">${fmt(p.startRaw)}</div>
        <div style="flex:1">
          <div class="prog-title">${p.title}</div>
          ${p.desc ? `<div class="prog-desc">${p.desc}</div>` : ''}
        </div>
      </div>`;
    });
    if (!ch.now && !(ch.next||[]).length) {
      ph = `<div class="programme"><div class="prog-time">—</div><div class="prog-title" style="color:#444">No schedule data</div></div>`;
    }
    return `<div class="channel-card">
      <div class="channel-header">${logo}
        <div><div class="channel-name">${ch.name}</div>
        <div class="channel-meta">${[ch.lang, ch.group].filter(Boolean).join(' · ')}</div></div>
      </div>${ph}
    </div>`;
  }).join('');

  const old = document.getElementById('load-more');
  if (old) old.remove();
  if (list.length > shown) {
    const btn = document.createElement('button');
    btn.id = 'load-more';
    btn.className = 'load-more-btn';
    btn.textContent = `Show more (${list.length - shown} remaining)`;
    btn.onclick = () => { shown += 20; render(); };
    document.getElementById('channel-list').appendChild(btn);
  }
}

async function load() {
  try {
    const res = await fetch(SERVER + '/guide?url=' + encodeURIComponent(EPG));
    if (!res.ok) throw new Error('Server returned ' + res.status);
    channels = await res.json();
    const onNow = channels.filter(ch => ch.now);
    const sportNow = channels.filter(ch => isSport(ch));
    const langs = [...new Set(channels.map(c => c.lang).filter(Boolean))].sort();
    const sel = document.getElementById('lang');
    langs.forEach(l => { const o = document.createElement('option'); o.value = l; o.textContent = l; sel.appendChild(o); });
    document.getElementById('s-channels').textContent = channels.length;
    document.getElementById('s-now').textContent = onNow.length;
    document.getElementById('s-sport').textContent = sportNow.length;
    document.getElementById('stats').style.display = 'flex';
    document.getElementById('controls').style.display = 'flex';
    document.getElementById('subtitle').textContent = channels.length.toLocaleString() + ' channels loaded';
    render();
  } catch(e) {
    document.getElementById('channel-list').innerHTML = `<div class="error-msg"><strong>Could not load EPG</strong><br><br>Error: ${e.message}</div>`;
  }
}

load();
</script>
</body>
</html>
