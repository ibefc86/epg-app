<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TV Guide</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #0f0f0f; color: #fff; }
.header { padding: 1.5rem; border-bottom: 1px solid #222; display: flex; align-items: center; justify-content: space-between; }
.header h1 { font-size: 22px; font-weight: 600; }
.header p { font-size: 13px; color: #888; margin-top: 2px; }
.btn-settings { background: #1a1a1a; border: 1px solid #333; border-radius: 8px; color: #aaa; padding: 8px 14px; font-size: 13px; cursor: pointer; }
.btn-settings:hover { background: #222; }
.overlay { position: fixed; inset: 0; background: #0f0f0f; z-index: 100; overflow-y: auto; display: none; }
.overlay.active { display: block; }
.overlay-header { padding: 1.5rem; border-bottom: 1px solid #222; }
.overlay-header h2 { font-size: 20px; font-weight: 600; }
.overlay-header p { font-size: 13px; color: #888; margin-top: 4px; }
.sport-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; padding: 1.5rem; }
.sport-card { background: #1a1a1a; border: 2px solid #222; border-radius: 12px; padding: 1.25rem 1rem; text-align: center; cursor: pointer; transition: all 0.15s; }
.sport-card:hover { background: #222; }
.sport-card.selected { border-color: #3b82f6; background: #0f2044; }
.sport-card .emoji { font-size: 32px; margin-bottom: 8px; }
.sport-card .name { font-size: 13px; font-weight: 500; color: #ddd; }
.sport-card.selected .name { color: #60a5fa; }
.overlay-footer { padding: 1.5rem; border-top: 1px solid #222; position: sticky; bottom: 0; background: #0f0f0f; }
.btn-save { width: 100%; padding: 14px; background: #3b82f6; border: none; border-radius: 10px; color: #fff; font-size: 16px; font-weight: 600; cursor: pointer; }
.tabs { display: flex; gap: 8px; padding: 1rem 1.5rem; border-bottom: 1px solid #222; flex-wrap: wrap; }
.tab { padding: 7px 16px; border-radius: 20px; border: 1px solid #333; background: transparent; color: #aaa; font-size: 13px; cursor: pointer; }
.tab.active { background: #fff; color: #000; border-color: #fff; font-weight: 500; }
.search-bar { padding: 1rem 1.5rem; border-bottom: 1px solid #222; display: none; }
.search-bar input { width: 100%; background: #1a1a1a; border: 1px solid #333; border-radius: 8px; padding: 10px 14px; color: #fff; font-size: 14px; outline: none; }
.search-bar input::placeholder { color: #555; }
.channel-list { padding: 1rem 1.5rem; max-width: 900px; }
.match-card { background: #1a1a1a; border-radius: 12px; padding: 1rem; margin-bottom: 10px; border: 1px solid #222; }
.match-card.live-card { border-color: #dc2626; border-width: 1.5px; }
.match-title { font-size: 16px; font-weight: 600; color: #fff; margin-bottom: 6px; }
.match-meta { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; flex-wrap: wrap; }
.match-time { font-size: 12px; color: #555; }
.match-desc { font-size: 12px; color: #555; margin-bottom: 10px; line-height: 1.4; }
.progress-wrap { height: 3px; background: #333; border-radius: 2px; margin-bottom: 12px; }
.progress-bar { height: 100%; background: #3b82f6; border-radius: 2px; }
.live-card .progress-bar { background: #dc2626; }
.channel-chips { display: flex; flex-wrap: wrap; gap: 8px; }
.channel-chip { display: flex; align-items: center; gap: 6px; background: #111; border: 1px solid #2a2a2a; border-radius: 8px; padding: 5px 10px; }
.chip-logo { width: 20px; height: 20px; object-fit: contain; border-radius: 3px; }
.chip-logo-placeholder { width: 20px; height: 20px; border-radius: 3px; background: #2a2a2a; display: flex; align-items: center; justify-content: center; font-size: 8px; color: #555; flex-shrink: 0; }
.chip-name { font-size: 12px; color: #aaa; }
.chip-tooltip { display: none; position: absolute; bottom: calc(100% + 6px); left: 50%; transform: translateX(-50%); background: #333; color: #fff; font-size: 12px; padding: 5px 10px; border-radius: 6px; white-space: nowrap; z-index: 10; pointer-events: none; }
.channel-chip { position: relative; }
.channel-chip:hover .chip-tooltip { display: block; }
.chip-quality { font-size: 10px; color: #555; margin-left: 2px; }
.hero-chip { background: #1a1a1a; border-color: #444; padding: 7px 12px; }
.more-btn { background: transparent; border: 1px solid #333; border-radius: 8px; color: #888; font-size: 12px; padding: 5px 10px; cursor: pointer; }
.more-btn:hover { background: #1a1a1a; color: #fff; }
.channel-card { background: #1a1a1a; border-radius: 12px; padding: 1rem; margin-bottom: 10px; border: 1px solid #222; }
.channel-card.live-card { border-color: #dc2626; border-width: 1.5px; }
.channel-header { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
.logo { width: 38px; height: 38px; object-fit: contain; border-radius: 6px; background: #111; flex-shrink: 0; }
.logo-placeholder { width: 38px; height: 38px; border-radius: 6px; background: #2a2a2a; display: flex; align-items: center; justify-content: center; font-size: 10px; color: #555; flex-shrink: 0; }
.channel-name { font-size: 14px; font-weight: 500; }
.channel-meta-small { font-size: 11px; color: #555; margin-top: 2px; }
.programme { display: flex; gap: 10px; padding: 6px 0; border-top: 1px solid #222; }
.prog-time { font-size: 12px; color: #555; min-width: 75px; flex-shrink: 0; padding-top: 2px; }
.prog-title { font-size: 13px; color: #ddd; font-weight: 500; }
.prog-desc { font-size: 12px; color: #555; margin-top: 3px; line-height: 1.4; }
.badge-now { display: inline-block; background: #16a34a; color: #fff; font-size: 10px; font-weight: 600; padding: 2px 6px; border-radius: 10px; margin-left: 6px; vertical-align: middle; }
.badge-live { display: inline-block; background: #dc2626; color: #fff; font-size: 10px; font-weight: 600; padding: 2px 6px; border-radius: 10px; margin-left: 4px; vertical-align: middle; animation: pulse 1.5s infinite; }
.badge-sport { display: inline-block; font-size: 10px; padding: 2px 6px; border-radius: 10px; margin-left: 4px; vertical-align: middle; background: #1d4ed8; color: #fff; }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
.load-more-btn { display: block; width: 100%; padding: 12px; background: #1a1a1a; border: 1px solid #333; border-radius: 10px; color: #aaa; font-size: 14px; cursor: pointer; margin-top: 8px; }
.status-msg { text-align: center; padding: 4rem 1rem; color: #555; font-size: 14px; }
.error-msg { background: #1a0a0a; border: 1px solid #5a1a1a; border-radius: 10px; padding: 1.25rem; color: #f87171; font-size: 13px; line-height: 1.7; margin: 1rem 0; }
.empty-fav { text-align: center; padding: 4rem 1.5rem; }
.empty-fav h3 { font-size: 18px; font-weight: 500; margin-bottom: 8px; }
.empty-fav p { font-size: 14px; color: #555; margin-bottom: 1.5rem; }
.empty-fav button { background: #3b82f6; border: none; border-radius: 10px; color: #fff; padding: 12px 24px; font-size: 14px; font-weight: 500; cursor: pointer; }
.section-label { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; font-weight: 600; margin: 1.25rem 0 0.5rem; display: flex; align-items: center; gap: 6px; }
.section-label.live { color: #dc2626; }
.section-label.live::before { content: '●'; animation: pulse 1.5s infinite; }
.section-label.other { color: #555; }
</style>
</head>
<body>

<div class="header">
  <div>
    <h1>📺 TV Guide</h1>
    <p id="subtitle">Loading...</p>
  </div>
  <button class="btn-settings" onclick="openPicker()">⚽ My Sports</button>
</div>

<div class="overlay" id="overlay">
  <div class="overlay-header">
    <h2>Pick your sports</h2>
    <p>We'll show you what's on live for these</p>
  </div>
  <div class="sport-grid" id="sport-grid"></div>
  <div class="overlay-footer">
    <button class="btn-save" onclick="saveSports()">Save my sports</button>
  </div>
</div>

<div class="tabs" id="tabs" style="display:none">
  <button class="tab active" onclick="setTab(this,'my')">Favorites</button>
  <button class="tab" onclick="setTab(this,'live')">Live Now</button>
  <button class="tab" onclick="setTab(this,'upcoming')">Upcoming</button>
  <button class="tab" onclick="setTab(this,'all')">All Channels</button>
</div>

<div class="search-bar" id="search-bar">
  <input type="text" id="search" placeholder="Search channels or shows..." oninput="render()" />
</div>

<div class="channel-list" id="channel-list">
  <div class="status-msg">Loading EPG data...</div>
</div>

<script>
const SERVER = 'https://epg-app-production.up.railway.app';

const SPORTS = [
  { id: 'soccer',      name: 'Soccer',        emoji: '⚽' },
  { id: 'nrl',         name: 'NRL',           emoji: '🏉' },
  { id: 'rugby_union', name: 'Rugby Union',   emoji: '🏆' },
  { id: 'afl',         name: 'AFL',           emoji: '🦘' },
  { id: 'cricket',     name: 'Cricket',       emoji: '🏏' },
  { id: 'nba',         name: 'NBA',           emoji: '🏀' },
  { id: 'nfl',         name: 'NFL',           emoji: '🏈' },
  { id: 'tennis',      name: 'Tennis',        emoji: '🎾' },
  { id: 'golf',        name: 'Golf',          emoji: '⛳' },
  { id: 'f1',          name: 'Formula 1',     emoji: '🏎️' },
  { id: 'boxing',      name: 'Boxing / MMA',  emoji: '🥊' },
  { id: 'ice_hockey',  name: 'Ice Hockey',    emoji: '🏒' },
  { id: 'baseball',    name: 'Baseball',      emoji: '⚾' },
  { id: 'cycling',     name: 'Cycling',       emoji: '🚴' },
  { id: 'racing',      name: 'Motorsport',    emoji: '🏁' },
  { id: 'olympic',     name: 'Olympics',      emoji: '🏅' },
];

const SPORT_NAMES = {
  soccer:'Soccer', nrl:'NRL', rugby_union:'Rugby Union', afl:'AFL',
  cricket:'Cricket', nba:'NBA', nfl:'NFL', tennis:'Tennis', golf:'Golf',
  f1:'Formula 1', boxing:'Boxing/MMA', ice_hockey:'Ice Hockey',
  baseball:'Baseball', cycling:'Cycling', racing:'Motorsport', olympic:'Olympics'
};

let channels = [], tab = 'my', shown = 20;
let favSports = JSON.parse(localStorage.getItem('favSports') || '[]');
let upcomingFixtures = [];

function openPicker() {
  document.getElementById('sport-grid').innerHTML = SPORTS.map(s =>
    `<div class="sport-card ${favSports.includes(s.id)?'selected':''}" onclick="toggleSport('${s.id}',this)">
      <div class="emoji">${s.emoji}</div>
      <div class="name">${s.name}</div>
    </div>`
  ).join('');
  document.getElementById('overlay').classList.add('active');
}

function toggleSport(id, el) {
  favSports = favSports.includes(id) ? favSports.filter(s=>s!==id) : [...favSports, id];
  el.classList.toggle('selected', favSports.includes(id));
}

function saveSports() {
  localStorage.setItem('favSports', JSON.stringify(favSports));
  document.getElementById('overlay').classList.remove('active');
  render();
}

function fmt(raw) {
  if (!raw) return '';
  const s = raw.toString().trim();
  const utc = new Date(Date.UTC(+s.slice(0,4),+s.slice(4,6)-1,+s.slice(6,8),+s.slice(8,10),+s.slice(10,12),0));
  const off = s.slice(12).trim();
  if (off.length >= 3) {
    const sign = off[0]==='-'?1:-1;
    utc.setMinutes(utc.getMinutes() - sign*(+off.slice(1,3)*60+(+off.slice(3,5)||0)));
  }
  return utc.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
}

function setTab(el, t) {
  tab = t; shown = 20;
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('search-bar').style.display = t==='all' ? 'block' : 'none';
  render();
}

function normaliseTitle(title) {
  if (!title) return '';
  return title
    .replace(/^(NRL|AFL|NBA|NFL|NHL|MLB|Golf|Tennis|Rugby|Soccer|Football|Cricket)\s*:\s*/i, '')
    .replace(/^(NRL Rugby|Super League Rugby|NRL Premiership|LIVE)\s*[:\-]?\s*/i, '')
    .replace(/\s*[\u02B0-\u02FF\u1D00-\u1DBF]+\s*$/, '')
    .trim();
}
function classifyUpcoming(prog) {
  if (!prog || !prog.sport) return null;
  return prog.sport;
}

function isNonLiveClient(title) {
  if (!title) return true;
  const t = title.toLowerCase();
  const NON_LIVE = ['highlights','replay','classic','documentary','news','magazine','preview','analysis','best of','greatest','history of','end of transmission','test card','review','the loop','extended','wrap','teleshopping'];
  return NON_LIVE.some(w => t.includes(w));
}

function groupUpcoming(channels, favSports) {
  const now = new Date();
  const groups = {};
  for (const ch of channels) {
    for (const prog of (ch.upcoming || [])) {
      const startTime = new Date(prog.startRaw ? 
        (() => { const s = prog.startRaw.toString().trim(); const utc = new Date(Date.UTC(+s.slice(0,4),+s.slice(4,6)-1,+s.slice(6,8),+s.slice(8,10),+s.slice(10,12),0)); const off = s.slice(12).trim(); if (off.length >= 3) { const sign = off[0]==='-'?-1:1; utc.setMinutes(utc.getMinutes() - sign*(+off.slice(1,3)*60+(+off.slice(3,5)||0))); } return utc; })() 
        : now);
      if (startTime <= now) continue;
      if (!prog.sport) continue;
      if (favSports.length && !favSports.includes(prog.sport.sportId)) continue;
      const key = prog.fixtureKey || normaliseTitle(prog.title).toLowerCase();
      if (!groups[key]) {
        groups[key] = {
          title: prog.displayName || normaliseTitle(prog.title),
          sport: prog.sport,
          isLive: false,
          pct: 0,
          startRaw: prog.startRaw,
          desc: prog.desc,
          channels: []
        };
      }
      if (!groups[key].channels.find(c => c.id === ch.id)) {
        groups[key].channels.push(ch);
      }
      if (!groups[key].startRaw || prog.startRaw < groups[key].startRaw) {
        groups[key].startRaw = prog.startRaw;
      }
    }
  }
  return Object.values(groups).sort((a,b) => a.startRaw > b.startRaw ? 1 : -1);
}
function groupByMatch(filteredChannels) {
  const groups = {};
  for (const ch of filteredChannels) {
    if (!ch.now) continue;
    // Use fixtureKey if available (ESPN match) otherwise fall back to normalised title
    const key = ch.now.sport?.fixtureKey || normaliseTitle(ch.now.title).toLowerCase();
    if (!groups[key]) {
      groups[key] = {
        // Use ESPN display name if available, otherwise clean EPG title
        title: ch.now.sport?.displayName || normaliseTitle(ch.now.title),
        sport: ch.now.sport,
        isLive: ch.now.isLive,
        pct: ch.now.pct,
        startRaw: ch.now.startRaw,
        desc: ch.now.desc,
        channels: []
      };
    }
    groups[key].channels.push(ch);
    if (ch.now.isLive) groups[key].isLive = true;
    // Prefer ESPN display name for title
    if (ch.now.sport?.displayName) groups[key].title = ch.now.sport.displayName;
  }
  return Object.values(groups).sort((a, b) => {
    if (a.isLive && !b.isLive) return -1;
    if (!a.isLive && b.isLive) return 1;
    return 0;
  });
}

function toggleMore(id) {
  const el = document.getElementById(id);
  const btn = el.previousElementSibling.querySelector('.more-btn');
  if (el.style.display === 'none') {
    el.style.display = 'flex';
    btn.textContent = btn.textContent.replace('▾', '▴');
  } else {
    el.style.display = 'none';
    btn.textContent = btn.textContent.replace('▴', '▾');
  }
}
function renderChip(ch) {
  const logo = ch.logo
    ? `<img class="chip-logo" src="${ch.logo}" alt="" onerror="this.style.display='none';this.nextSibling.style.display='flex'"/><div class="chip-logo-placeholder" style="display:none">${(ch.displayName||ch.name||'').slice(0,2)}</div>`
    : `<div class="chip-logo-placeholder">${(ch.displayName||ch.name||'').slice(0,2)}</div>`;
  const quality = ch.quality ? `<span class="chip-quality">${ch.quality}</span>` : '';
  return `<div class="channel-chip">${logo}<span class="chip-name">${ch.displayName||ch.name}</span>${quality}<span class="chip-tooltip">${ch.displayName||ch.name}</span></div>`;
}

function renderMatchCard(group) {
  const sport = group.sport;
  const sportName = sport ? (SPORT_NAMES[sport.sportId] || sport.sportId) : '';
  const sportBadge = sport ? `<span class="badge-sport">${sport.emoji} ${sportName}</span>` : '';
  const liveBadge = group.isLive ? `<span class="badge-live">● Live</span>` : '';
  const QUALITY_ORDER = {'4K':4,'FHD':3,'HD':2,'SD':1,'':0};
  const sorted = [...group.channels].sort((a,b) => (QUALITY_ORDER[b.quality]||0) - (QUALITY_ORDER[a.quality]||0));
  const hero = sorted[0];
  const rest = sorted.slice(1);
  const cardId = 'card-' + Math.random().toString(36).slice(2);
  const heroLogo = hero.logo
    ? `<img class="chip-logo" style="width:28px;height:28px" src="${hero.logo}" alt="" onerror="this.style.display='none';this.nextSibling.style.display='flex'"/><div class="chip-logo-placeholder" style="display:none;width:28px;height:28px">${(hero.displayName||hero.name||'').slice(0,2)}</div>`
    : `<div class="chip-logo-placeholder" style="width:28px;height:28px">${(hero.displayName||hero.name||'').slice(0,2)}</div>`;
  const heroChip = `<div class="channel-chip hero-chip">${heroLogo}<span class="chip-name" style="font-size:13px;font-weight:500;color:#fff">${hero.displayName||hero.name}</span>${hero.quality?`<span class="chip-quality" style="font-size:11px">${hero.quality}</span>`:''}</div>`;
  const moreBtn = rest.length ? `<button class="more-btn" onclick="toggleMore('${cardId}')">▾ ${rest.length} more channel${rest.length>1?'s':''}</button>` : '';
  const restChips = rest.length ? `<div class="more-chips" id="${cardId}" style="display:none;flex-wrap:wrap;gap:8px;margin-top:8px">${rest.map(renderChip).join('')}</div>` : '';
  return `<div class="match-card${group.isLive?' live-card':''}">
    <div class="match-title">${group.title}</div>
    <div class="match-meta">
      <span class="match-time">${fmt(group.startRaw)}</span>
      ${liveBadge}${sportBadge}
    </div>
    ${group.desc ? `<div class="match-desc">${group.desc}</div>` : ''}
    <div class="progress-wrap"><div class="progress-bar" style="width:${group.pct}%"></div></div>
    <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
      ${heroChip}
      ${moreBtn}
    </div>
    ${restChips}
  </div>`;
}

function renderChannelCard(ch) {
  const sport = ch.now?.sport;
  const sportName = sport ? (SPORT_NAMES[sport.sportId] || sport.sportId) : '';
  const sportBadge = sport ? `<span class="badge-sport">${sport.emoji} ${sportName}</span>` : '';
  const liveBadge = ch.now?.isLive ? `<span class="badge-live">● Live</span>` : '';
  const logo = ch.logo
    ? `<img class="logo" src="${ch.logo}" alt="" onerror="this.style.display='none';this.nextSibling.style.display='flex'"/><div class="logo-placeholder" style="display:none">${(ch.name||'').slice(0,3)}</div>`
    : `<div class="logo-placeholder">${(ch.name||'').slice(0,3)}</div>`;
  let ph = '';
  if (ch.now) {
    ph += `<div class="programme"><div class="prog-time">${fmt(ch.now.startRaw)}</div><div style="flex:1"><div class="prog-title">${ch.now.title}<span class="badge-now">Now</span>${liveBadge}${sportBadge}</div>${ch.now.desc?`<div class="prog-desc">${ch.now.desc}</div>`:''}<div class="progress-wrap"><div class="progress-bar" style="width:${ch.now.pct}%"></div></div></div></div>`;
  }
  (ch.next||[]).forEach(p => {
    ph += `<div class="programme"><div class="prog-time">${fmt(p.startRaw)}</div><div style="flex:1"><div class="prog-title">${p.title}</div>${p.desc?`<div class="prog-desc">${p.desc}</div>`:''}</div></div>`;
  });
  if (!ch.now && !(ch.next||[]).length) ph = `<div class="programme"><div class="prog-time">—</div><div class="prog-title" style="color:#444">No schedule data</div></div>`;
  return `<div class="channel-card${ch.now?.isLive?' live-card':''}"><div class="channel-header">${logo}<div><div class="channel-name">${ch.displayName||ch.name}${ch.quality?` <span style="font-size:10px;color:#555;font-weight:400">${ch.quality}</span>`:''}</div><div class="channel-meta-small">${ch.lang||''}</div></div></div>${ph}</div>`;
}

function filtered() {
  const q = (document.getElementById('search')?.value||'').toLowerCase();
  return channels.filter(ch => {
    if (tab==='my') return ch.now && ch.now.sport && favSports.includes(ch.now.sport.sportId);
    if (tab==='live') return ch.now && ch.now.isLive;
    if (tab==='upcoming') return (ch.upcoming||[]).some(p => classifyUpcoming(p));
    if (q) {
      const nm=(ch.name||'').toLowerCase().includes(q);
      const np=((ch.now||{}).title||'').toLowerCase().includes(q);
      const nx=(ch.next||[]).some(p=>(p.title||'').toLowerCase().includes(q));
      if (!nm&&!np&&!nx) return false;
    }
    return true;
  });
}

function render() {
  const list = filtered();
  const el = document.getElementById('channel-list');

  if (tab==='my' && !favSports.length) {
    el.innerHTML = `<div class="empty-fav"><h3>Pick your sports</h3><p>Tell us what you watch and we'll show you what's live right now.</p><button onclick="openPicker()">Choose my sports</button></div>`;
    return;
  }
  if ((tab==='my'||tab==='live') && !list.length) {
    el.innerHTML = `<div class="empty-fav"><h3>Nothing live right now</h3><p>No matches currently in progress. Check back later or browse All On Now.</p>${tab==='my'?`<button onclick="openPicker()">Update my sports</button>`:''}</div>`;
    return;
  }
  if (!list.length) { el.innerHTML='<div class="status-msg">No channels match.</div>'; return; }

  if (tab === 'upcoming') {
    const groups = groupUpcoming(channels, favSports);
    if (!groups.length) {
      el.innerHTML = `<div class="empty-fav"><h3>Nothing upcoming</h3><p>No sports events found in the next 24 hours matching your channels.</p></div>`;
      return;
    }
    el.innerHTML = groups.map(renderMatchCard).join('');
    return;
  }

  if (tab === 'my' || tab === 'live') {
    const groups = groupByMatch(list);
    const liveGroups = groups.filter(g => g.isLive);
    const otherGroups = groups.filter(g => !g.isLive);
    let html = '';
    if (liveGroups.length) {
      html += `<div class="section-label live">Live now</div>`;
      html += liveGroups.map(renderMatchCard).join('');
    }
    if (otherGroups.length && tab === 'my') {
      html += `<div class="section-label other">On now</div>`;
      html += otherGroups.map(renderMatchCard).join('');
    }
    el.innerHTML = html;
    return;
  }

  el.innerHTML = list.slice(0, shown).map(renderChannelCard).join('');
  const old = document.getElementById('load-more');
  if (old) old.remove();
  if (list.length > shown) {
    const btn = document.createElement('button');
    btn.id='load-more'; btn.className='load-more-btn';
    btn.textContent=`Show more (${list.length-shown} remaining)`;
    btn.onclick=()=>{shown+=20;render();};
    el.appendChild(btn);
  }
}

async function load() {
  try {
    const [guideRes, fixturesRes] = await Promise.all([
      fetch(SERVER+'/guide'),
      fetch(SERVER+'/fixtures')
    ]);
    upcomingFixtures = await fixturesRes.json();
    const res = guideRes;
    if (res.status===503) {
      document.getElementById('subtitle').textContent='Loading EPG, retrying...';
      setTimeout(load,15000);
      return;
    }
    if (!res.ok) throw new Error('Server returned '+res.status);
    channels = await res.json();
    document.getElementById('subtitle').textContent = channels.length.toLocaleString()+' channels loaded';
    document.getElementById('tabs').style.display='flex';
    if (!favSports.length) setTimeout(openPicker, 500);
    render();
  } catch(e) {
    document.getElementById('channel-list').innerHTML=`<div class="error-msg"><strong>Could not load EPG</strong><br><br>Error: ${e.message}</div>`;
  }
}

load();
</script>
