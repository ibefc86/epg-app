<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TV Guide</title>
<style>
:root {
  --bg: #0c0c0f;
  --bg2: #131316;
  --bg3: #1a1a1e;
  --bg4: #222228;
  --border: #1e1e24;
  --border2: #2a2a32;
  --border3: #3a3a44;
  --text: #f0f0f5;
  --text2: #b8b8c8;
  --text3: #78788a;
  --text4: #52526a;
  --text5: #36364a;
  --tab-active-bg: #f0f0f5;
  --tab-active-text: #0c0c0f;
  --sport-selected-bg: #0d1f3c;
  --sport-selected-text: #60a5fa;
  --tooltip-bg: #2a2a32;
  --card-shadow: 0 1px 3px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.04);
  --live-shadow: 0 0 0 1.5px #ef4444, 0 4px 24px rgba(239,68,68,0.18);
}
:root[data-theme="light"],
:root[data-theme="light"] * { color-scheme: light; }
:root[data-theme="light"] {
  --bg: #f2f2f5;
  --bg2: #ffffff;
  --bg3: #f8f8fa;
  --bg4: #ebebef;
  --border: #e4e4ea;
  --border2: #d4d4dc;
  --border3: #b8b8c4;
  --text: #0c0c12;
  --text2: #2a2a38;
  --text3: #60607a;
  --text4: #80809a;
  --text5: #a0a0b8;
  --tab-active-bg: #0c0c12;
  --tab-active-text: #ffffff;
  --sport-selected-bg: #dbeafe;
  --sport-selected-text: #1d4ed8;
  --tooltip-bg: #2a2a38;
  --card-shadow: 0 1px 4px rgba(0,0,0,0.07), 0 0 0 1px rgba(0,0,0,0.05);
  --live-shadow: 0 0 0 1.5px #ef4444, 0 4px 24px rgba(239,68,68,0.1);
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #f2f2f5;
    --bg2: #ffffff;
    --bg3: #f8f8fa;
    --bg4: #ebebef;
    --border: #e4e4ea;
    --border2: #d4d4dc;
    --border3: #b8b8c4;
    --text: #0c0c12;
    --text2: #2a2a38;
    --text3: #60607a;
    --text4: #80809a;
    --text5: #a0a0b8;
    --tab-active-bg: #0c0c12;
    --tab-active-text: #ffffff;
    --sport-selected-bg: #dbeafe;
    --sport-selected-text: #1d4ed8;
    --tooltip-bg: #2a2a38;
    --card-shadow: 0 1px 4px rgba(0,0,0,0.07), 0 0 0 1px rgba(0,0,0,0.05);
    --live-shadow: 0 0 0 1.5px #ef4444, 0 4px 24px rgba(239,68,68,0.1);
  }
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif; background: var(--bg); color: var(--text); transition: background 0.2s, color 0.2s; }

/* Header */
.header { padding: 1.25rem 1.5rem; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
.header h1 { font-size: 20px; font-weight: 700; letter-spacing: -0.4px; }
.header p { font-size: 12px; color: var(--text4); margin-top: 3px; letter-spacing: 0.1px; }
.header-right { display: flex; align-items: center; gap: 8px; }
.btn-settings { background: var(--bg3); border: 1px solid var(--border2); border-radius: 20px; color: var(--text3); padding: 7px 14px; font-size: 12px; font-weight: 500; cursor: pointer; transition: all 0.15s; }
.btn-settings:hover { background: var(--bg4); color: var(--text2); }
.btn-theme { background: var(--bg3); border: 1px solid var(--border2); border-radius: 20px; color: var(--text3); padding: 7px 10px; font-size: 14px; cursor: pointer; line-height: 1; transition: all 0.15s; }
.btn-theme:hover { background: var(--bg4); }

/* Sports picker overlay */
.overlay { position: fixed; inset: 0; background: var(--bg); z-index: 100; overflow-y: auto; display: none; }
.overlay.active { display: block; }
.overlay-header { padding: 1.5rem; border-bottom: 1px solid var(--border); }
.overlay-header h2 { font-size: 20px; font-weight: 700; letter-spacing: -0.3px; }
.overlay-header p { font-size: 13px; color: var(--text4); margin-top: 4px; }
.sport-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; padding: 1.5rem; }
.sport-card { background: var(--bg2); border: 1.5px solid var(--border); border-radius: 14px; padding: 1.25rem 1rem; text-align: center; cursor: pointer; transition: all 0.15s; box-shadow: var(--card-shadow); }
.sport-card:hover { border-color: var(--border3); transform: translateY(-1px); }
.sport-card.selected { border-color: #3b82f6; background: var(--sport-selected-bg); }
.sport-card .emoji { font-size: 30px; margin-bottom: 8px; }
.sport-card .name { font-size: 12px; font-weight: 600; color: var(--text2); letter-spacing: 0.1px; }
.sport-card.selected .name { color: var(--sport-selected-text); }
.overlay-footer { padding: 1.25rem 1.5rem; border-top: 1px solid var(--border); position: sticky; bottom: 0; background: var(--bg); }
.btn-save { width: 100%; padding: 13px; background: #3b82f6; border: none; border-radius: 12px; color: #fff; font-size: 15px; font-weight: 600; cursor: pointer; letter-spacing: -0.1px; }

/* Tabs */
.tabs { display: flex; gap: 6px; padding: 0.875rem 1.5rem; border-bottom: 1px solid var(--border); }
.tab { padding: 6px 16px; border-radius: 20px; border: 1.5px solid var(--border2); background: transparent; color: var(--text3); font-size: 13px; font-weight: 500; cursor: pointer; transition: all 0.15s; }
.tab:hover { border-color: var(--border3); color: var(--text2); }
.tab.active { background: var(--tab-active-bg); color: var(--tab-active-text); border-color: var(--tab-active-bg); }

/* Search */
.search-bar { padding: 0.875rem 1.5rem; border-bottom: 1px solid var(--border); display: none; }
.search-bar input { width: 100%; background: var(--bg3); border: 1.5px solid var(--border2); border-radius: 10px; padding: 10px 14px; color: var(--text); font-size: 14px; outline: none; transition: border-color 0.15s; }
.search-bar input:focus { border-color: var(--border3); }
.search-bar input::placeholder { color: var(--text4); }

/* Content area */
.channel-list { padding: 1.25rem 1.5rem; max-width: 900px; }

/* Match cards */
.match-card { background: var(--bg2); border-radius: 16px; padding: 1.25rem; margin-bottom: 12px; border: 1px solid var(--border); box-shadow: var(--card-shadow); }
.match-card.live-card { border-color: transparent; box-shadow: var(--live-shadow); }
.match-title { font-size: 18px; font-weight: 700; color: var(--text); margin-bottom: 6px; letter-spacing: -0.3px; line-height: 1.25; }
.match-meta { display: flex; align-items: center; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; }
.match-time { font-size: 13px; color: var(--text4); font-weight: 500; }
.match-desc { font-size: 13px; color: var(--text3); margin-bottom: 12px; line-height: 1.5; }
.progress-wrap { height: 4px; background: var(--border2); border-radius: 4px; margin-bottom: 14px; overflow: hidden; }
.progress-bar { height: 100%; background: linear-gradient(90deg, #3b82f6, #6ca3f8); border-radius: 4px; }
.live-card .progress-bar { background: linear-gradient(90deg, #ef4444, #f87171); }

/* Channel chips */
.channel-chips { display: flex; flex-wrap: wrap; gap: 8px; }
.channel-chip { display: flex; align-items: center; gap: 6px; background: var(--bg3); border: 1px solid var(--border); border-radius: 10px; padding: 5px 10px; position: relative; transition: border-color 0.15s; }
.channel-chip:hover { border-color: var(--border3); }
.chip-logo { width: 18px; height: 18px; object-fit: contain; border-radius: 3px; background: var(--bg4); }
.chip-logo-placeholder { width: 18px; height: 18px; border-radius: 3px; background: var(--bg4); display: flex; align-items: center; justify-content: center; font-size: 7px; color: var(--text4); flex-shrink: 0; }
.chip-name { font-size: 12px; color: var(--text3); font-weight: 500; }
.chip-tooltip { display: none; position: absolute; bottom: calc(100% + 6px); left: 50%; transform: translateX(-50%); background: var(--tooltip-bg); color: var(--text); font-size: 12px; padding: 5px 10px; border-radius: 8px; white-space: nowrap; z-index: 10; pointer-events: none; border: 1px solid var(--border2); }
.channel-chip:hover .chip-tooltip { display: block; }
.chip-quality { font-size: 10px; color: var(--text5); margin-left: 2px; font-weight: 600; letter-spacing: 0.3px; }
.hero-chip { background: var(--bg3); border-color: var(--border3); padding: 8px 12px; }
.more-btn { background: transparent; border: 1px solid var(--border2); border-radius: 10px; color: var(--text4); font-size: 12px; font-weight: 500; padding: 5px 12px; cursor: pointer; transition: all 0.15s; }
.more-btn:hover { background: var(--bg3); color: var(--text2); border-color: var(--border3); }

/* Channel cards (All Channels tab) */
.channel-card { background: var(--bg2); border-radius: 16px; padding: 1.125rem; margin-bottom: 10px; border: 1px solid var(--border); box-shadow: var(--card-shadow); }
.channel-card.live-card { border-color: transparent; box-shadow: var(--live-shadow); }
.channel-header { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.logo { width: 36px; height: 36px; object-fit: contain; border-radius: 8px; background: var(--bg3); flex-shrink: 0; }
.logo-placeholder { width: 36px; height: 36px; border-radius: 8px; background: var(--bg4); display: flex; align-items: center; justify-content: center; font-size: 10px; color: var(--text4); flex-shrink: 0; font-weight: 600; }
.channel-name { font-size: 14px; font-weight: 600; letter-spacing: -0.1px; }
.channel-meta-small { font-size: 11px; color: var(--text4); margin-top: 2px; }
.programme { display: flex; gap: 12px; padding: 8px 0; border-top: 1px solid var(--border); }
.prog-time { font-size: 12px; color: var(--text4); min-width: 72px; flex-shrink: 0; padding-top: 1px; font-weight: 500; font-variant-numeric: tabular-nums; }
.prog-title { font-size: 13px; color: var(--text2); font-weight: 500; }
.prog-desc { font-size: 12px; color: var(--text4); margin-top: 3px; line-height: 1.45; }

/* Badges */
.badge-now { display: inline-block; background: #16a34a; color: #fff; font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 6px; margin-left: 6px; vertical-align: middle; letter-spacing: 0.3px; }
.badge-live { display: inline-block; background: #ef4444; color: #fff; font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 6px; margin-left: 4px; vertical-align: middle; letter-spacing: 0.3px; animation: pulse 1.5s infinite; }
.badge-sport { display: inline-block; font-size: 11px; font-weight: 500; padding: 3px 8px; border-radius: 8px; margin-left: 4px; vertical-align: middle; background: rgba(59,130,246,0.15); color: #60a5fa; border: 1px solid rgba(59,130,246,0.2); }
[data-theme="light"] .badge-sport, :root:not([data-theme="dark"]) .badge-sport { background: #dbeafe; color: #1d4ed8; border-color: #bfdbfe; }
@media (prefers-color-scheme: light) { .badge-sport { background: #dbeafe; color: #1d4ed8; border-color: #bfdbfe; } }

@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }

/* Section labels */
.section-label { font-size: 13px; font-weight: 600; margin: 1.75rem 0 0.875rem; display: flex; align-items: center; gap: 8px; letter-spacing: -0.1px; color: var(--text2); }
.section-label.live { color: var(--text); }
.section-label.live::before { content: ''; display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #ef4444; flex-shrink: 0; animation: pulse 1.5s infinite; }
.section-label.other::before { content: ''; display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--border3); flex-shrink: 0; }

/* Misc */
.load-more-btn { display: block; width: 100%; padding: 12px; background: var(--bg2); border: 1px solid var(--border2); border-radius: 12px; color: var(--text3); font-size: 14px; font-weight: 500; cursor: pointer; margin-top: 10px; transition: all 0.15s; }
.load-more-btn:hover { background: var(--bg3); border-color: var(--border3); }
.status-msg { text-align: center; padding: 4rem 1rem; color: var(--text4); font-size: 14px; }
.error-msg { background: rgba(239,68,68,0.06); border: 1px solid rgba(239,68,68,0.2); border-radius: 12px; padding: 1.25rem; color: #f87171; font-size: 13px; line-height: 1.7; margin: 1rem 0; }
.empty-fav { text-align: center; padding: 4rem 1.5rem; }
.empty-fav h3 { font-size: 20px; font-weight: 700; margin-bottom: 8px; letter-spacing: -0.3px; }
.empty-fav p { font-size: 14px; color: var(--text4); margin-bottom: 1.5rem; line-height: 1.5; }
.empty-fav button { background: #3b82f6; border: none; border-radius: 12px; color: #fff; padding: 12px 28px; font-size: 14px; font-weight: 600; cursor: pointer; }

/* Team logos */
.team-logos { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
.team-logo-wrap { width: 38px; height: 38px; border-radius: 50%; background: #fff; overflow: hidden; flex-shrink: 0; box-shadow: 0 1px 6px rgba(0,0,0,0.25); display: flex; align-items: center; justify-content: center; }
.team-logo-img { display: block; }
.team-logo-img.logo-flag { width: 38px; height: 38px; object-fit: cover; }
.team-logo-img.logo-badge { width: 27px; height: 27px; object-fit: contain; }
.team-logo-vs { font-size: 11px; color: var(--text4); font-weight: 600; letter-spacing: 0.5px; }
</style>
</head>
<body>

<div class="header">
  <div>
    <h1>TV Guide</h1>
    <p id="subtitle">Loading... · <span id="clock"></span></p>
  </div>
  <div class="header-right">
    <div id="clock" style="font-size:13px;color:var(--text3)"></div>
    <button class="btn-theme" onclick="cycleTheme()" id="btn-theme" title="Toggle theme">🌙</button>
    <button class="btn-settings" onclick="openPicker()">⚽ My Sports</button>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="overlay-header">
    <h2>Pick your sports</h2>
    <p>We'll show you what's on live for these</p>
  </div>
  <div class="sport-grid" id="sport-grid"></div>
  <div class="overlay-footer">
    <button class="btn-save" onclick="saveSports()">Save my sports</button>
  </div>
</div>

<div class="tabs" id="tabs" style="display:none">
  <button class="tab active" onclick="setTab(this,'my')">Favorites</button>
 <button class="tab" onclick="setTab(this,'all-live')">All Sports</button>
  <button class="tab" onclick="setTab(this,'all')">All Channels</button>
</div>

<div class="search-bar" id="search-bar">
  <input type="text" id="search" placeholder="Search channels or shows..." oninput="render()" />
</div>

<div class="channel-list" id="channel-list">
  <div class="status-msg">Loading EPG data...</div>
</div>

<script>
const SERVER = 'https://epg-app-production.up.railway.app';

const SPORTS = [
  { id: 'soccer',      name: 'Soccer',        emoji: '⚽' },
  { id: 'nrl',         name: 'NRL',           emoji: '🏉' },
  { id: 'rugby_union', name: 'Rugby Union',   emoji: '🏆' },
  { id: 'afl',         name: 'AFL',           emoji: '🦘' },
  { id: 'cricket',     name: 'Cricket',       emoji: '🏏' },
  { id: 'nba',         name: 'NBA',           emoji: '🏀' },
  { id: 'nfl',         name: 'NFL',           emoji: '🏈' },
  { id: 'tennis',      name: 'Tennis',        emoji: '🎾' },
  { id: 'golf',        name: 'Golf',          emoji: '⛳' },
  { id: 'f1',          name: 'Formula 1',     emoji: '🏎️' },
  { id: 'boxing',      name: 'Boxing / MMA',  emoji: '🥊' },
  { id: 'ice_hockey',  name: 'Ice Hockey',    emoji: '🏒' },
  { id: 'baseball',    name: 'Baseball',      emoji: '⚾' },
  { id: 'cycling',     name: 'Cycling',       emoji: '🚴' },
  { id: 'racing',      name: 'Motorsport',    emoji: '🏁' },
  { id: 'olympic',     name: 'Olympics',      emoji: '🏅' },
];

const SPORT_NAMES = {
  soccer:'Soccer', nrl:'NRL', rugby_union:'Rugby Union', afl:'AFL',
  cricket:'Cricket', nba:'NBA', nfl:'NFL', tennis:'Tennis', golf:'Golf',
  f1:'Formula 1', boxing:'Boxing/MMA', ice_hockey:'Ice Hockey',
  baseball:'Baseball', cycling:'Cycling', racing:'Motorsport', olympic:'Olympics',
  live:'Live'
};

let channels = [], tab = 'my', shown = 20;
let favSports = JSON.parse(localStorage.getItem('favSports') || '[]');
let upcomingFixtures = [];

function openPicker() {
  document.getElementById('sport-grid').innerHTML = SPORTS.map(s =>
    `<div class="sport-card ${favSports.includes(s.id)?'selected':''}" onclick="toggleSport('${s.id}',this)">
      <div class="emoji">${s.emoji}</div>
      <div class="name">${s.name}</div>
    </div>`
  ).join('');
  document.getElementById('overlay').classList.add('active');
}

function toggleSport(id, el) {
  favSports = favSports.includes(id) ? favSports.filter(s=>s!==id) : [...favSports, id];
  el.classList.toggle('selected', favSports.includes(id));
}

function saveSports() {
  localStorage.setItem('favSports', JSON.stringify(favSports));
  document.getElementById('overlay').classList.remove('active');
  render();
}

function fmtISO(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  return d.toLocaleTimeString('en-AU',{hour:'2-digit',minute:'2-digit',timeZone:'Australia/Sydney'});
}

function fmt(raw) {
  if (!raw) return '';
  const s = raw.toString().trim();
  const utc = new Date(Date.UTC(+s.slice(0,4),+s.slice(4,6)-1,+s.slice(6,8),+s.slice(8,10),+s.slice(10,12),0));
 const off = s.slice(15).trim();
  if (off.length >= 5) {
    const sign = off[0]==='+' ? -1 : 1;
    utc.setMinutes(utc.getMinutes() + sign*(+off.slice(1,3)*60+(+off.slice(3,5)||0)));
  }
  return utc.toLocaleTimeString('en-AU',{hour:'2-digit',minute:'2-digit',timeZone:'Australia/Sydney'});
}

function setTab(el, t) {
  tab = t; shown = 20;
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('search-bar').style.display = t==='all' ? 'block' : 'none';
  render();
}

function normaliseTitle(title) {
  if (!title) return '';
  return title
    .replace(/^(NRL|AFL|NBA|NFL|NHL|MLB|Golf|Tennis|Rugby|Soccer|Football|Cricket)\s*:\s*/i, '')
    .replace(/^(NRL Rugby|Super League Rugby|NRL Premiership|LIVE)\s*[:\-]?\s*/i, '')
    .replace(/\s*[\u02B0-\u02FF\u1D00-\u1DBF]+\s*$/, '')
    .trim();
}
function classifyUpcoming(prog) {
  if (!prog || !prog.sport) return null;
  return prog.sport;
}

function isEnglishDesc(desc) {
  if (!desc) return false;
  const nonAscii = (desc.match(/[^\x00-\x7F]/g) || []).length;
  if (nonAscii / desc.length > 0.05) return false;
  const t = ' ' + desc.toLowerCase() + ' ';
  const englishMarkers = [' the ',' and ',' in ',' at ',' for ',' of ',' is ',' are ',' on ',' to ',' with ',' host',' game ',' match ',' play',' season',' round ',' cup ',' league '];
  return englishMarkers.some(w => t.includes(w));
}

function isNonLiveClient(title) {
  if (!title) return true;
  const t = title.toLowerCase();
  const NON_LIVE = ['highlights','replay','classic','documentary','news','magazine','preview','analysis','best of','greatest','history of','end of transmission','test card','review','the loop','extended','wrap','teleshopping'];
  return NON_LIVE.some(w => t.includes(w));
}

function groupUpcoming(channels, favSports) {
  const now = new Date();
  const groups = {};
  for (const ch of channels) {
    for (const prog of (ch.upcoming || [])) {
      const startTime = new Date(prog.startRaw ? 
        (() => { const s = prog.startRaw.toString().trim(); const utc = new Date(Date.UTC(+s.slice(0,4),+s.slice(4,6)-1,+s.slice(6,8),+s.slice(8,10),+s.slice(10,12),0)); const off = s.slice(15).trim(); if (off.length >= 3) { const sign = off[0]==='-'?-1:1; utc.setMinutes(utc.getMinutes() - sign*(+off.slice(1,3)*60+(+off.slice(3,5)||0))); } return utc; })() 
        : now);
      if (startTime <= now) continue;
      if (!prog.sport) continue;
      if (favSports.length && !favSports.includes(prog.sport.sportId)) continue;
      const key = prog.fixtureKey || normaliseTitle(prog.title).toLowerCase();
      if (!groups[key]) {
        const effectiveTime = prog.espnStartTime ? new Date(prog.espnStartTime).getTime() : startTime.getTime();
        groups[key] = {
          title: prog.displayName || normaliseTitle(prog.title),
          sport: prog.sport,
          isLive: false,
          pct: 0,
          startRaw: prog.startRaw,
          espnStartTime: prog.espnStartTime || null,
          effectiveTime,
          desc: prog.sport?.espnDesc || (isEnglishDesc(prog.desc) ? prog.desc : ''),
          channels: []
        };
      }
      if (!groups[key].channels.find(c => c.id === ch.id)) {
        groups[key].channels.push(ch);
      }
      if (!groups[key].desc && isEnglishDesc(prog.desc)) groups[key].desc = prog.desc;
      if (!groups[key].startRaw) {
        groups[key].startRaw = prog.startRaw;
      }
    }
  }
  return Object.values(groups).sort((a,b) => a.effectiveTime - b.effectiveTime);
}
function groupByMatch(filteredChannels) {
  const groups = {};
  for (const ch of filteredChannels) {
    if (!ch.now) continue;
    // Use fixtureKey if available (ESPN match) otherwise fall back to normalised title
    const key = ch.now.sport?.fixtureKey || normaliseTitle(ch.now.title).toLowerCase();
    if (!groups[key]) {
      groups[key] = {
        title: ch.now.sport?.displayName || normaliseTitle(ch.now.title),
        sport: ch.now.sport,
        isLive: ch.now.isLive,
        pct: ch.now.pct,
        startRaw: ch.now.startRaw,
        desc: ch.now.sport?.espnDesc || (isEnglishDesc(ch.now.desc) ? ch.now.desc : ''),
        channels: []
      };
    }
    groups[key].channels.push(ch);
    if (ch.now.isLive) groups[key].isLive = true;
    if (ch.now.sport?.displayName) groups[key].title = ch.now.sport.displayName;
    if (!groups[key].desc && isEnglishDesc(ch.now.desc)) groups[key].desc = ch.now.desc;
  }
  return Object.values(groups).sort((a, b) => {
    if (a.isLive && !b.isLive) return -1;
    if (!a.isLive && b.isLive) return 1;
    return 0;
  });
}

function toggleMore(id) {
  const el = document.getElementById(id);
  const btn = el.previousElementSibling.querySelector('.more-btn');
  if (el.style.display === 'none') {
    el.style.display = 'flex';
    btn.textContent = btn.textContent.replace('▾', '▴');
  } else {
    el.style.display = 'none';
    btn.textContent = btn.textContent.replace('▴', '▾');
  }
}
function renderChip(ch) {
  const logo = ch.logo
    ? `<img class="chip-logo" src="${ch.logo}" alt="" onerror="this.style.display='none';this.nextSibling.style.display='flex'"/><div class="chip-logo-placeholder" style="display:none">${(ch.displayName||ch.name||'').slice(0,2)}</div>`
    : `<div class="chip-logo-placeholder">${(ch.displayName||ch.name||'').slice(0,2)}</div>`;
  const quality = ch.quality ? `<span class="chip-quality">${ch.quality}</span>` : '';
  return `<div class="channel-chip">${logo}<span class="chip-name">${ch.displayName||ch.name}</span>${quality}<span class="chip-tooltip">${ch.displayName||ch.name}</span></div>`;
}

function isFlag(url) { return url && url.includes('/countries/'); }
function logoClass(url) { return isFlag(url) ? 'logo-flag' : 'logo-badge'; }

function renderMatchCard(group) {
  const sport = group.sport;
  const sportName = sport ? (SPORT_NAMES[sport.sportId] || sport.sportId) : '';
  const sportBadge = sport ? `<span class="badge-sport">${sport.emoji} ${sportName}</span>` : '';
  const liveBadge = group.isLive ? `<span class="badge-live">● Live</span>` : '';
  const homeLogo = sport?.homeLogo;
  const awayLogo = sport?.awayLogo;
  const teamLogos = (homeLogo || awayLogo) ? `<div class="team-logos">
    ${homeLogo ? `<div class="team-logo-wrap"><img class="team-logo-img ${logoClass(homeLogo)}" src="${homeLogo}" alt="" onerror="this.parentElement.style.display='none'"></div>` : ''}
    ${(homeLogo && awayLogo) ? `<span class="team-logo-vs">v</span>` : ''}
    ${awayLogo ? `<div class="team-logo-wrap"><img class="team-logo-img ${logoClass(awayLogo)}" src="${awayLogo}" alt="" onerror="this.parentElement.style.display='none'"></div>` : ''}
  </div>` : '';
  const QUALITY_ORDER = {'4K':4,'FHD':3,'HD':2,'SD':1,'':0};
  const sorted = [...group.channels].sort((a,b) => (QUALITY_ORDER[b.quality]||0) - (QUALITY_ORDER[a.quality]||0));
  const hero = sorted[0];
  const rest = sorted.slice(1);
  const cardId = 'card-' + Math.random().toString(36).slice(2);
  const heroLogo = hero.logo
    ? `<img class="chip-logo" style="width:28px;height:28px" src="${hero.logo}" alt="" onerror="this.style.display='none';this.nextSibling.style.display='flex'"/><div class="chip-logo-placeholder" style="display:none;width:28px;height:28px">${(hero.displayName||hero.name||'').slice(0,2)}</div>`
    : `<div class="chip-logo-placeholder" style="width:28px;height:28px">${(hero.displayName||hero.name||'').slice(0,2)}</div>`;
  const heroChip = `<div class="channel-chip hero-chip">${heroLogo}<span class="chip-name" style="font-size:13px;font-weight:500;color:var(--text)">${hero.displayName||hero.name}</span>${hero.quality?`<span class="chip-quality" style="font-size:11px">${hero.quality}</span>`:''}</div>`;
  const moreBtn = rest.length ? `<button class="more-btn" onclick="toggleMore('${cardId}')">▾ ${rest.length} more channel${rest.length>1?'s':''}</button>` : '';
  const restChips = rest.length ? `<div class="more-chips" id="${cardId}" style="display:none;flex-wrap:wrap;gap:8px;margin-top:8px">${rest.map(renderChip).join('')}</div>` : '';
  return `<div class="match-card${group.isLive?' live-card':''}">
    ${teamLogos}
    <div class="match-title">${group.title}</div>
    <div class="match-meta">
      <span class="match-time">${group.espnStartTime ? fmtISO(group.espnStartTime) : fmt(group.startRaw)}</span>
      ${liveBadge}${sportBadge}
    </div>
    ${group.desc ? `<div class="match-desc">${group.desc}</div>` : ''}
    <div class="progress-wrap"><div class="progress-bar" style="width:${group.pct}%"></div></div>
    <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
      ${heroChip}
      ${moreBtn}
    </div>
    ${restChips}
  </div>`;
}

function renderChannelCard(ch) {
  const sport = ch.now?.sport;
  const sportName = sport ? (SPORT_NAMES[sport.sportId] || sport.sportId) : '';
  const sportBadge = sport ? `<span class="badge-sport">${sport.emoji} ${sportName}</span>` : '';
  const liveBadge = ch.now?.isLive ? `<span class="badge-live">● Live</span>` : '';
  const logo = ch.logo
    ? `<img class="logo" src="${ch.logo}" alt="" onerror="this.style.display='none';this.nextSibling.style.display='flex'"/><div class="logo-placeholder" style="display:none">${(ch.name||'').slice(0,3)}</div>`
    : `<div class="logo-placeholder">${(ch.name||'').slice(0,3)}</div>`;
  let ph = '';
  if (ch.now) {
    ph += `<div class="programme"><div class="prog-time">${fmt(ch.now.startRaw)}</div><div style="flex:1"><div class="prog-title">${ch.now.title}<span class="badge-now">Now</span>${liveBadge}${sportBadge}</div>${ch.now.desc?`<div class="prog-desc">${ch.now.desc}</div>`:''}<div class="progress-wrap"><div class="progress-bar" style="width:${ch.now.pct}%"></div></div></div></div>`;
  }
  (ch.next||[]).forEach(p => {
    ph += `<div class="programme"><div class="prog-time">${fmt(p.startRaw)}</div><div style="flex:1"><div class="prog-title">${p.title}</div>${p.desc?`<div class="prog-desc">${p.desc}</div>`:''}</div></div>`;
  });
  if (!ch.now && !(ch.next||[]).length) ph = `<div class="programme"><div class="prog-time">—</div><div class="prog-title" style="color:#444">No schedule data</div></div>`;
  return `<div class="channel-card${ch.now?.isLive?' live-card':''}"><div class="channel-header">${logo}<div><div class="channel-name">${ch.displayName||ch.name}${ch.quality?` <span style="font-size:10px;color:#555;font-weight:400">${ch.quality}</span>`:''}</div><div class="channel-meta-small">${ch.lang||''}</div></div></div>${ph}</div>`;
}

function filtered() {
  const q = (document.getElementById('search')?.value||'').toLowerCase();
  return channels.filter(ch => {
    if (tab==='my') return ch.now?.sport && favSports.includes(ch.now.sport.sportId);
    if (tab==='all-live') return ch.now?.sport && ch.now.sport.sportId !== 'live';
    if (q) {
      const nm=(ch.name||'').toLowerCase().includes(q);
      const np=((ch.now||{}).title||'').toLowerCase().includes(q);
      const nx=(ch.next||[]).some(p=>(p.title||'').toLowerCase().includes(q));
      return nm||np||nx;
    }
    return true;
  });
}

 function render() {
  const list = filtered();
  const el = document.getElementById('channel-list');

  if (tab==='my' && !favSports.length) {
    el.innerHTML = `<div class="empty-fav"><h3>Pick your sports</h3><p>Tell us what you watch and we'll show you what's live right now.</p><button onclick="openPicker()">Choose my sports</button></div>`;
    return;
  }

  if (tab === 'my') {
    const liveGroups = groupByMatch(list).filter(g => g.isLive);
    const upcomingGroups = groupUpcoming(channels, favSports);
    let html = '';
    if (liveGroups.length) {
      html += `<div class="section-label live">Live now</div>`;
      html += liveGroups.map(renderMatchCard).join('');
    }
    if (upcomingGroups.length) {
      html += `<div class="section-label other" style="color:#888">Upcoming</div>`;
      html += upcomingGroups.map(renderMatchCard).join('');
    }
    if (!liveGroups.length && !upcomingGroups.length) {
      el.innerHTML = `<div class="empty-fav"><h3>Nothing on right now</h3><p>No live or upcoming events for your sports.</p><button onclick="openPicker()">Update my sports</button></div>`;
      return;
    }
    el.innerHTML = html;
    return;
  }

  if (tab === 'all-live') {
    const liveGroups = groupByMatch(channels.filter(ch => ch.now?.isLive && ch.now?.sport?.sportId !== 'live')).filter(g => g.isLive);
    const upcomingGroups = groupUpcoming(channels, []);
    let html = '';
    if (liveGroups.length) {
      html += `<div class="section-label live">Live now</div>`;
      html += liveGroups.map(renderMatchCard).join('');
    }
    if (upcomingGroups.length) {
      html += `<div class="section-label other" style="color:#888">Upcoming</div>`;
      html += upcomingGroups.map(renderMatchCard).join('');
    }
    if (!liveGroups.length && !upcomingGroups.length) {
      el.innerHTML = `<div class="empty-fav"><h3>Nothing live right now</h3><p>No matches currently in progress.</p></div>`;
      return;
    }
    el.innerHTML = html;
    return;
  }

  if (!list.length) { el.innerHTML='<div class="status-msg">No channels match.</div>'; return; }

  el.innerHTML = list.slice(0, shown).map(renderChannelCard).join('');
  const old = document.getElementById('load-more');
  if (old) old.remove();
  if (list.length > shown) {
    const btn = document.createElement('button');
    btn.id='load-more'; btn.className='load-more-btn';
    btn.textContent=`Show more (${list.length-shown} remaining)`;
    btn.onclick=()=>{shown+=20;render();};
    el.appendChild(btn);
  }
}

async function load() {
  try {
    const [guideRes, fixturesRes] = await Promise.all([
      fetch(SERVER+'/guide'),
      fetch(SERVER+'/fixtures')
    ]);
    upcomingFixtures = await fixturesRes.json();
    const res = guideRes;
    if (res.status===503) {
      document.getElementById('subtitle').textContent='Loading EPG, retrying...';
      setTimeout(load,15000);
      return;
    }
    if (!res.ok) throw new Error('Server returned '+res.status);
    channels = await res.json();
    document.getElementById('subtitle').textContent = channels.length.toLocaleString()+' channels loaded';
    document.getElementById('tabs').style.display='flex';
    if (!favSports.length) setTimeout(openPicker, 500);
    render();
  } catch(e) {
    document.getElementById('channel-list').innerHTML=`<div class="error-msg"><strong>Could not load EPG</strong><br><br>Error: ${e.message}</div>`;
  }
}

setInterval(()=>{
  document.getElementById('clock').textContent = new Date().toLocaleTimeString('en-AU',{hour:'2-digit',minute:'2-digit',timeZone:'Australia/Sydney',hour12:true});
},1000);

const THEME_ICONS = { auto: '🌓', light: '☀️', dark: '🌙' };
let themeMode = localStorage.getItem('theme') || 'auto';

function applyTheme() {
  const root = document.documentElement;
  if (themeMode === 'dark') root.setAttribute('data-theme', 'dark');
  else if (themeMode === 'light') root.setAttribute('data-theme', 'light');
  else root.removeAttribute('data-theme');
  document.getElementById('btn-theme').textContent = THEME_ICONS[themeMode];
}

function cycleTheme() {
  themeMode = themeMode === 'auto' ? 'light' : themeMode === 'light' ? 'dark' : 'auto';
  localStorage.setItem('theme', themeMode);
  applyTheme();
}

applyTheme();
load();
</script>
